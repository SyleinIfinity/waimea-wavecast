server {
    listen 80;
    server_name _;

    location /api/v1/ {
        proxy_pass http://database-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health/live {
        proxy_pass http://database-api:8000;
    }

    location = /health/ready {
        proxy_pass http://database-api:8000;
    }

    location / {
        return 404;
    }
}
