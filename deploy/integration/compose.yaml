services:
  database-api:
    build: ../../apps/database_api
    environment:
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-waimea_wavecast}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      DEMO_DELETE_ENABLED: ${DEMO_DELETE_ENABLED:-false}
      DEMO_BACKUP_CONFIRMED: ${DEMO_BACKUP_CONFIRMED:-false}
    expose:
      - "8000"
    networks:
      - private
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - database-api
    networks:
      - private
    restart: unless-stopped

networks:
  private:
