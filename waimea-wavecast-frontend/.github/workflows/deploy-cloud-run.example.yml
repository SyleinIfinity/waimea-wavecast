# EXAMPLE ONLY. Rename to deploy-cloud-run.yml and configure OIDC/WIF and IAM first.
name: deploy-cloud-run
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: asia-southeast1
        run: |
          gcloud builds submit . --tag "${REGION}-docker.pkg.dev/${PROJECT_ID}/waimea/waimea-frontend:${GITHUB_SHA}" --project "$PROJECT_ID"
          gcloud run deploy waimea-frontend --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/waimea/waimea-frontend:${GITHUB_SHA}" --region "$REGION" --port 8080 --allow-unauthenticated --project "$PROJECT_ID"
# Important: frontend build arg currently defaults to apiwaimea.liems.io.vn. For a different API URL, customize Cloud Build substitutions or Docker build args.
